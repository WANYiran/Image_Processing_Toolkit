<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量图片尺寸调整工具</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>批量图片尺寸调整工具</h1>
        <div style="margin-bottom: 20px;">
            <a href="/" class="back-link">← 返回主页</a>
        </div>
        
        <div class="section">
            <h2>选择图片文件</h2>
            <div style="margin-bottom: 15px;">
                <label style="margin-right: 15px;">
                    <input type="radio" name="uploadType" value="local" checked onchange="switchUploadType('local')">
                    本地上传
                </label>
                <label>
                    <input type="radio" name="uploadType" value="csv" onchange="switchUploadType('csv')">
                    CSV批量上传
                </label>
            </div>
            <div id="localUploadSection">
                <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
                <button id="selectBtn" class="btn btn-primary">选择图片（可多选）</button>
                <div id="fileList" class="file-list"></div>
            </div>
            <div id="csvUploadSection" style="display: none;">
                <input type="file" id="csvFileInput" accept=".csv" style="display: none;">
                <button id="selectCsvBtn" class="btn btn-primary">选择CSV文件</button>
                <div id="csvFileInfo" style="display: none; margin-top: 15px; padding: 15px; background: #e8f5e9; border-radius: 4px;">
                    <p><strong>已上传文件:</strong> <span id="csvFileName"></span></p>
                    <p><strong>图片数量:</strong> <span id="csvImageCount">0</span></p>
                </div>
                <div id="csvColumnSelectors" style="display: none; margin-top: 15px; padding: 15px; background: #f5f5f5; border-radius: 4px;">
                    <div style="margin-bottom: 15px;">
                        <label for="csvUrlColumnSelect" style="display: block; margin-bottom: 8px; font-weight: bold;">
                            选择包含图片URL的列：
                        </label>
                        <select id="csvUrlColumnSelect" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
                            <option value="">请先上传CSV文件</option>
                        </select>
                    </div>
                    <div>
                        <label for="csvNameColumnSelect" style="display: block; margin-bottom: 8px; font-weight: bold;">
                            选择用于文件命名的列：
                        </label>
                        <select id="csvNameColumnSelect" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
                            <option value="">请先上传CSV文件</option>
                        </select>
                        <p style="margin-top: 8px; color: #666; font-size: 12px;">
                            处理后的图片将使用此列的值作为文件名
                        </p>
                    </div>
                </div>
                <div id="csvImageList" class="file-list" style="margin-top: 15px;"></div>
            </div>
        </div>
        
        <div class="section">
            <h2>设置目标尺寸</h2>
            <div class="size-inputs">
                <div class="input-group">
                    <label for="widthInput">宽度（像素）：</label>
                    <input type="number" id="widthInput" min="1" value="800" class="input">
                </div>
                <div class="input-group">
                    <label for="heightInput">高度（像素）：</label>
                    <input type="number" id="heightInput" min="1" value="600" class="input">
                </div>
            </div>
        </div>
        
        <div class="section">
            <button id="processBtn" class="btn btn-success" disabled>开始处理</button>
            <div id="progress" class="progress-container" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill">0%</div>
                </div>
                <div class="progress-text" id="progressText">等待开始...</div>
            </div>
        </div>
        
        <div class="section">
            <h2>处理结果</h2>
            <div id="downloadAllContainer" style="display: none; margin-bottom: 15px;">
                <button id="downloadAllBtn" class="btn btn-primary">全部下载</button>
            </div>
            <div id="results" class="results-container"></div>
        </div>
    </div>
    
    <script src="/static/resize_image.js"></script>
</body>
</html>
