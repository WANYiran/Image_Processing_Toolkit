<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量图片裁切工具</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>批量图片裁切工具</h1>
        <div style="margin-bottom: 20px;">
            <a href="/" class="back-link">← 返回主页</a>
        </div>
        
        <div class="upload-section">
            <h2>1. 上传图片</h2>
            <div style="margin-bottom: 15px;">
                <label style="margin-right: 15px;">
                    <input type="radio" name="uploadType" value="local" checked onchange="switchUploadType('local')">
                    本地上传
                </label>
                <label>
                    <input type="radio" name="uploadType" value="csv" onchange="switchUploadType('csv')">
                    CSV批量上传
                </label>
            </div>
            <div id="localUploadSection">
                <div class="upload-container">
                    <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-content">
                            <div class="upload-icon">
                                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="17 8 12 3 7 8"></polyline>
                                    <line x1="12" y1="3" x2="12" y2="15"></line>
                                </svg>
                            </div>
                            <p class="upload-text">拖拽图片到这里</p>
                            <p class="upload-divider">或</p>
                            <p class="hint">支持批量上传 JPG、PNG、GIF 等格式</p>
                        </div>
                    </div>
                    <div class="upload-button-wrapper">
                        <button type="button" class="btn btn-upload" id="uploadBtn" onclick="document.getElementById('fileInput').click()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            选择图片文件
                        </button>
                    </div>
                </div>
                <div class="file-list" id="fileList">
                    <p style="color: #9E9E9E; font-weight: 300; font-size: 0.9em;">暂无上传文件</p>
                </div>
            </div>
            <div id="csvUploadSection" style="display: none;">
                <input type="file" id="csvFileInput" accept=".csv" style="display: none;">
                <button type="button" class="btn btn-upload" id="selectCsvBtn" onclick="document.getElementById('csvFileInput').click()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    选择CSV文件
                </button>
                <div id="csvFileInfo" style="display: none; margin-top: 15px; padding: 15px; background: #e8f5e9; border-radius: 4px;">
                    <p><strong>已上传文件:</strong> <span id="csvFileName"></span></p>
                    <p><strong>图片数量:</strong> <span id="csvImageCount">0</span></p>
                </div>
                <div id="csvColumnSelectors" style="display: none; margin-top: 15px; padding: 15px; background: #f5f5f5; border-radius: 4px;">
                    <div style="margin-bottom: 15px;">
                        <label for="csvUrlColumnSelect" style="display: block; margin-bottom: 8px; font-weight: bold;">
                            选择包含图片URL的列：
                        </label>
                        <select id="csvUrlColumnSelect" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
                            <option value="">请先上传CSV文件</option>
                        </select>
                    </div>
                    <div>
                        <label for="csvNameColumnSelect" style="display: block; margin-bottom: 8px; font-weight: bold;">
                            选择用于文件命名的列：
                        </label>
                        <select id="csvNameColumnSelect" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
                            <option value="">请先上传CSV文件</option>
                        </select>
                        <p style="margin-top: 8px; color: #666; font-size: 12px;">
                            处理后的图片将使用此列的值作为文件名
                        </p>
                    </div>
                </div>
                <div id="csvImageList" class="file-list" style="margin-top: 15px;">
                    <p style="color: #9E9E9E; font-weight: 300; font-size: 0.9em;">暂无上传文件</p>
                </div>
            </div>
        </div>

        <div class="crop-section">
            <h2>2. 设置裁切参数</h2>
            <div class="crop-controls">
                <div class="control-group">
                    <label for="cropTop">上方裁切像素：</label>
                    <input type="number" id="cropTop" min="0" value="0" step="1">
                    <span class="unit">px</span>
                </div>
                <div class="control-group">
                    <label for="cropBottom">下方裁切像素：</label>
                    <input type="number" id="cropBottom" min="0" value="0" step="1">
                    <span class="unit">px</span>
                </div>
                <div class="control-group">
                    <label for="cropLeft">左侧裁切像素：</label>
                    <input type="number" id="cropLeft" min="0" value="0" step="1">
                    <span class="unit">px</span>
                </div>
                <div class="control-group">
                    <label for="cropRight">右侧裁切像素：</label>
                    <input type="number" id="cropRight" min="0" value="0" step="1">
                    <span class="unit">px</span>
                </div>
                <button id="applyCrop" class="btn btn-primary">应用裁切</button>
            </div>
        </div>

        <div class="preview-section">
            <h2>3. 预览与下载</h2>
            <div class="preview-grid" id="previewGrid"></div>
            <div class="download-section">
                <button id="downloadAll" class="btn btn-success" disabled>批量下载所有图片</button>
                <button id="clearAll" class="btn btn-secondary">清空所有</button>
            </div>
        </div>
    </div>

    <script src="/static/crop_image.js"></script>
</body>
</html>
