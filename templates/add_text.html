<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片加字工具</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .add-text-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .upload-section {
            background: white;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            border-color: #4CAF50;
            background: #f9f9f9;
        }
        
        .upload-area.dragover {
            border-color: #4CAF50;
            background: #e8f5e9;
        }
        
        .preview-section {
            display: none;
            background: white;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .preview-wrapper {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        
        .preview-image-container {
            position: relative;
            display: inline-block;
            flex: 1;
            text-align: center;
        }
        
        .control-panel-wrapper {
            flex: 0 0 400px;
            background: #f5f5f5;
            border-radius: 8px;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 600px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        
        .text-overlay {
            position: absolute;
            cursor: move;
            user-select: none;
            z-index: 10;
            pointer-events: auto;
            background: transparent;
        }
        
        .text-overlay.dragging {
            opacity: 0.8;
        }
        
        .text-overlay-title,
        .text-overlay-subtitle {
            font-weight: bold;
            white-space: nowrap;  /* 不换行，保持一行 */
            overflow: visible;     /* 允许超出边界 */
            margin: 0;
            display: block;
        }
        
        .control-panel {
            background: transparent;
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        
        .text-field-item {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            position: relative;
        }
        
        .text-field-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .text-field-header h4 {
            margin: 0;
            color: #333;
        }
        
        .text-field-remove {
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .text-field-remove:hover {
            background: #cc0000;
        }
        
        .text-template-editor {
            position: relative;
        }
        
        .text-template-input {
            width: 100%;
            min-height: 60px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            resize: vertical;
        }
        
        .insert-field-btn {
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .insert-field-btn:hover {
            background: #45a049;
        }
        
        .csv-field-item {
            padding: 8px;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 5px;
        }
        
        .csv-field-item:hover {
            background: #f0f0f0;
        }
        
        .field-placeholder {
            background: #e3f2fd;
            color: #1976d2;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }
        
        .control-row {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .control-item {
            flex: 1;
            min-width: 150px;
        }
        
        .control-item input[type="text"],
        .control-item input[type="number"],
        .control-item input[type="color"],
        .control-item select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .control-item input[type="range"] {
            width: 100%;
        }
        
        .range-value {
            display: inline-block;
            min-width: 50px;
            text-align: center;
            font-weight: bold;
        }
        
        .gallery-section {
            display: none;
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .gallery-item {
            position: relative;
            border: 2px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .gallery-item:hover {
            border-color: #4CAF50;
            transform: scale(1.05);
        }
        
        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .gallery-item .edit-badge {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(76, 175, 80, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            overflow: auto;
        }
        
        .modal-content {
            background-color: #fefefe;
            margin: 2% auto;
            padding: 20px;
            border: 1px solid #888;
            border-radius: 8px;
            width: 90%;
            max-width: 1200px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .close:hover {
            color: #000;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #4CAF50;
            color: white;
        }
        
        .btn-primary:hover {
            background: #45a049;
        }
        
        .btn-secondary {
            background: #2196F3;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #0b7dda;
        }
        
        .btn-danger {
            background: #f44336;
            color: white;
        }
        
        .btn-danger:hover {
            background: #da190b;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .info-text {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .textarea-control {
            width: 100%;
            min-height: 80px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="add-text-container">
        <header class="main-header">
            <h1>📝 图片加字工具</h1>
            <p>批量给图片添加标题文字</p>
        </header>
        
        <!-- 上传区域 -->
        <div class="upload-section">
            <h2>1. 上传图片和CSV文件</h2>
            <div class="upload-area" id="imageUploadArea">
                <p>📷 点击或拖拽上传图片文件（支持多选）</p>
                <input type="file" id="imageInput" multiple accept="image/*" style="display: none;">
            </div>
            <div class="upload-area" id="csvUploadArea">
                <p>📄 点击或拖拽上传CSV文件</p>
                <input type="file" id="csvInput" accept=".csv" style="display: none;">
            </div>
            <div id="uploadInfo" style="display: none; margin-top: 20px; padding: 15px; background: #e8f5e9; border-radius: 8px;">
                <p><strong>已上传：</strong><span id="imageCount">0</span> 张图片，<span id="csvFileName">-</span></p>
            </div>
            <div id="csvColumnSelector" style="display: none; margin-top: 15px; padding: 15px; background: #f5f5f5; border-radius: 4px;">
                <div>
                    <label for="matchColumnSelect" style="display: block; margin-bottom: 8px; font-weight: bold;">
                        选择用于匹配图片文件名的列：
                    </label>
                    <select id="matchColumnSelect" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
                        <option value="">请先上传CSV文件</option>
                    </select>
                    <p style="margin-top: 8px; color: #666; font-size: 12px;">
                        图片文件名（不含扩展名）将与此列的值进行匹配
                    </p>
                </div>
            </div>
        </div>
        
        <!-- 预览和调整区域 -->
        <div class="preview-section" id="previewSection">
            <h2>2. 调整文字参数（以第一张图片为例）</h2>
            <p style="color: #666; margin-bottom: 15px;">💡 提示：点击文字选中，拖动四个角调整大小，按住Shift可平直移动</p>
            <div class="preview-wrapper">
                <div class="preview-image-container" id="previewContainer">
                    <div id="textOverlayContainer" style="position: relative; display: inline-block; min-width: 200px; min-height: 200px;">
                        <img id="previewImage" style="max-width: 100%; max-height: 600px; position: relative; z-index: 1;" alt="预览图片">
                        <!-- 文字层将动态添加到这里 -->
                    </div>
                    <!-- 吸附指示线 -->
                    <div id="snapIndicators" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30;"></div>
                </div>
                
                <div class="control-panel-wrapper">
                    <div class="control-panel">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <h3 style="margin: 0;">文字字段设置</h3>
                            <button class="btn btn-small" id="addTextFieldBtn" style="padding: 5px 15px; font-size: 14px;">+ 添加文字字段</button>
                        </div>
                        
                        <!-- 动态文字字段容器 -->
                        <div id="textFieldsContainer">
                            <!-- 文字字段将动态添加到这里 -->
                        </div>
                        
                        <!-- CSV字段选择器（隐藏，用于插入字段） -->
                        <div id="csvFieldSelector" style="display: none; position: absolute; background: white; border: 1px solid #ddd; border-radius: 4px; padding: 10px; z-index: 1000; max-height: 200px; overflow-y: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                            <div style="font-weight: bold; margin-bottom: 10px;">选择CSV字段：</div>
                            <div id="csvFieldsList"></div>
                        </div>
                        
                        <div class="btn-group" style="margin-top: 30px;">
                            <button class="btn btn-primary" id="applyToAllBtn">确认并应用到所有图片</button>
                            <button class="btn btn-secondary" id="resetBtn">重置</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 结果展示区域 -->
        <div class="gallery-section" id="gallerySection">
            <h2>3. 处理结果预览</h2>
            <div class="btn-group">
                <button class="btn btn-primary" id="batchSaveBtn">批量保存所有图片</button>
                <button class="btn btn-secondary" id="refreshBtn">刷新预览</button>
            </div>
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>
    </div>
    
    <!-- 单张编辑模态框 -->
    <div id="editModal" class="modal">
        <div class="modal-content" style="max-width: 95%; width: 95%;">
            <span class="close" id="closeModal">&times;</span>
            <h2>编辑单张图片</h2>
            <p style="color: #666; margin-bottom: 15px;">💡 提示：点击文字选中，拖动四个角调整大小，按住Shift可平直移动</p>
            <div class="preview-wrapper">
                <div class="preview-image-container" id="editPreviewContainer">
                    <div id="editTextOverlayContainer" style="position: relative; display: inline-block; min-width: 200px; min-height: 200px; background: #f0f0f0;">
                        <img id="editPreviewImage" style="max-width: 100%; max-height: 600px; display: none; position: relative; z-index: 1;" alt="预览图片">
                        <!-- 文字层将动态添加到这里 -->
                    </div>
                    <!-- 吸附指示线 -->
                    <div id="editSnapIndicators" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30;"></div>
                </div>
                
                <div class="control-panel-wrapper">
                    <div class="control-panel" id="editFieldsContainer">
                        <!-- 动态字段控件将在这里生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/add_text.js"></script>
</body>
</html>
